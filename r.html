<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161616">
<title>Factura de pedido · PITBULLS</title>
<meta property="og:title" content="Factura de pedido · PITBULLS">
<meta property="og:description" content="Toca para ver el detalle del pedido.">
<meta property="og:image" content="https://tiendapitbulls.github.io/fotos/portada.jpg">
<link rel="icon" href="fotos/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Tiquete de impresora térmica: papel blanco, tinta negra, bordes cortados, logo arriba */
:root{--paper:#fdfcf8;--ink:#161616;--soft:#6d6a64}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:#161616 radial-gradient(70% 50% at 50% 0,#2a2a2a,#161616);font:14px/1.45 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);padding:28px 14px 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:380px;margin:0 auto}
.paper{position:relative;background:var(--paper);padding:30px 22px 34px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));animation:print .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes print{from{clip-path:inset(-20px 0 100% 0);transform:translateY(-14px)}to{clip-path:inset(-20px 0 -20px 0);transform:none}}
.paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:10px;background-size:14px 10px;background-repeat:repeat-x}
.paper::before{top:-10px;background-image:linear-gradient(135deg,transparent 50%,var(--paper) 50%),linear-gradient(-135deg,transparent 50%,var(--paper) 50%);background-position:0 0,7px 0}
.paper::after{bottom:-10px;background-image:linear-gradient(45deg,transparent 50%,var(--paper) 50%),linear-gradient(-45deg,transparent 50%,var(--paper) 50%);background-position:0 0,7px 0}
.c{text-align:center}
.logo{display:block;width:74px;height:auto;margin:0 auto 10px;filter:invert(1) contrast(1.4)}
.brand{font-weight:700;font-size:22px;letter-spacing:.18em}
.tag{font-size:12px;margin:2px 0 10px}
.small{font-size:12px;color:var(--soft)}
hr{border:0;border-top:1.5px dashed #9a968e;margin:14px 0}
hr.eq{border-top:3px double var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px}
.kv b{font-weight:700}
.kv span:last-child{text-align:right}
h2{font-size:12px;font-weight:700;letter-spacing:.12em;margin:0 0 6px}
.item{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px 0}
.item+.item{border-top:1px dotted #c9c5bd}
.th{width:56px;height:56px;border:1px solid #d9d5cc;background:#fff;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.item .n{font-weight:700;line-height:1.25}
.item .m{font-size:12px;color:var(--soft)}
.item .kv{margin-top:2px}
.total{font-size:20px;font-weight:700}
.badge{display:inline-block;border:1.5px solid var(--ink);padding:2px 8px;font-weight:700;font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.bars{display:flex;justify-content:center;align-items:stretch;height:46px;gap:0;margin:6px auto 4px}
.bars i{display:block;background:var(--ink)}
.thanks{font-weight:700;margin-top:10px}
.acts{display:grid;gap:10px;margin-top:26px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;border-radius:2px;font:600 15px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-decoration:none;border:1px solid #fff;color:#fff;background:transparent;cursor:pointer}
.btn.wa{background:#25d366;border-color:#25d366;color:#04230f}
.btn svg{width:20px;height:20px}
.err{color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:60px 10px}
.err a{color:#d9b768}
@media print{body{background:#fff;padding:0}.paper{filter:none;animation:none;padding:10px 6px}.paper::before,.paper::after,.acts{display:none}}
@media(prefers-reduced-motion:reduce){.paper{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
{
const STORE_WA='573133058948';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>'$'+Number(v||0).toLocaleString('es-CO');
const DL={pickup:'RECOGE EN TIENDA',local:'DOMICILIO EN FUNDACIÓN',nacional:'ENVÍO NACIONAL'};
function decode(h){
  const b=h.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b+'==='.slice((b.length+3)%4));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes));
}
function bars(code){
  let h='',x=0;for(const ch of code+'PITBULLS'){const n=ch.charCodeAt(0);for(let k=0;k<4;k++){const w=((n>>k)&1)+1;h+=`<i style="width:${w*1.6}px;margin-right:${(((n>>(k+1))&1)+1)*1.4}px"></i>`;x++}}
  return h;
}
const app=document.getElementById('app');
let o=null;
try{o=decode(location.hash.slice(1))}catch(e){}
if(!o||!o.i){
  app.innerHTML='<div class="err"><p>No encontramos los datos de este pedido.</p><p><a href="./">Ir a la tienda PITBULLS</a></p></div>';
}else{
  const c=o.c||{},a=o.a||{};
  const sub=o.i.reduce((s,it)=>s+it[4]*it[5],0);
  const items=o.i.map(it=>{const [id,n,col,sz,q,p,img]=it;return `<div class="item"><div class="th">${img?`<img src="${esc(img)}" alt="">`:''}</div><div><div class="n">${esc(n)}</div><div class="m">${col?esc(col)+' · ':''}Talla ${esc(sz)}</div><div class="kv"><span>${q} x ${money(p)}</span><b>${money(q*p)}</b></div></div></div>`}).join('');
  const addr=o.d==='pickup'?'Calle 5 # 6-24, Centro<br>Fundación, Magdalena':`${esc(a.a)}<br>Barrio ${esc(a.b)}${a.r?`<br>Ref.: ${esc(a.r)}`:''}<br>${o.d==='nacional'?`${esc(a.c)}, ${esc(a.dp)}`:'Fundación, Magdalena'}`;
  const first=(c.n||'').split(' ')[0];
  const cel=String(c.w||c.t||'').replace(/\D/g,'');
  const conf=`Hola ${first}, te escribimos de PITBULLS. Recibimos tu pedido ${o.n} por ${money(sub)}. `+(o.d==='pickup'?'Te avisamos cuando esté listo para recoger en la tienda.':'Te confirmamos el valor del envío y los datos de pago para despacharlo.');
  app.innerHTML=`<div class="paper">
    <div class="c">
      <img class="logo" src="fotos/logo.png" alt="PITBULLS">
      <div class="brand">PITBULLS</div>
      <div class="tag">Siempre diferentes.</div>
      <div class="small">Calle 5 # 6-24, Centro<br>Fundación, Magdalena<br>WhatsApp 313 305 8948</div>
    </div>
    <hr>
    <div class="kv"><span>PEDIDO</span><b>${esc(o.n)}</b></div>
    <div class="kv"><span>FECHA</span><span>${esc(o.f)}</span></div>
    <hr>
    <h2>CLIENTE</h2>
    <div><b>${esc(c.n)}</b></div>
    <div class="small">Cel. ${esc(c.t)}<br>WhatsApp ${esc(c.w)}<br>${esc(c.e)}</div>
    <hr>
    <h2>PRODUCTOS</h2>
    ${items}
    <hr>
    <div class="kv"><span>SUBTOTAL</span><span>${money(sub)}</span></div>
    <div class="kv"><span>ENVÍO</span><span>${o.d==='pickup'?'SIN COSTO':'POR CONFIRMAR'}</span></div>
    <hr class="eq">
    <div class="kv total"><span>TOTAL</span><span>${money(sub)}</span></div>
    ${o.d==='pickup'?'':'<div class="small" style="text-align:right">+ envío</div>'}
    <hr>
    <h2>ENTREGA</h2>
    <div class="badge">${DL[o.d]||''}</div>
    <div>${addr}</div>
    ${o.o?`<hr><h2>NOTA</h2><div>${esc(o.o)}</div>`:''}
    <hr>
    <div class="bars" aria-hidden="true">${bars(o.n)}</div>
    <div class="c small">${esc(o.n)}</div>
    <div class="c thanks">¡Gracias por tu compra!</div>
    <div class="c small">tiendapitbulls.github.io</div>
  </div>
  <div class="acts">
    ${cel.length>=10?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/57${cel.slice(-10)}?text=${encodeURIComponent(conf)}"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3a13 13 0 00-11.2 19.6L3 29l6.6-1.7A13 13 0 1016 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1116 26.6z"/></svg>Confirmar al cliente</a>`:''}
    <button class="btn" type="button" id="pr">Imprimir o guardar PDF</button>
  </div>`;
  document.getElementById('pr').onclick=()=>window.print();
  document.title=`${o.n} · Factura PITBULLS`;
}
}
</script>
</body>
</html>
